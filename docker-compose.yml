# Try the production image on your own computer: http://localhost:3000
# For a real server use deploy/ (HTTPS, backups, secrets) — see docs/DEPLOY.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dobi
      POSTGRES_PASSWORD: dobi
      POSTGRES_DB: dobimaster
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dobi']
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dobi:dobi@db:5432/dobimaster
      PUBLIC_URL: http://localhost:3000
      JWT_SECRET: local-only-secret-not-for-any-real-server-0123456789
      # Fake payment page, so you can click through pay & start locally.
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_PAYMENTS: 'true'
    ports:
      - '3000:3000'
volumes:
  pgdata:
